name: Build static iftop
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install Buildroot prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc binutils bzip2 cpio curl file git gzip patch perl python3 rsync unzip wget xz-utils
      - run: bash build-iftop.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: iftop-linux-${{ matrix.arch }}
          path: dist/iftop-linux-${{ matrix.arch }}
          if-no-files-found: error

  image:
    needs: binary
    runs-on: ubuntu-24.04
    env:
      TCR_REGISTRY: ${{ vars.TCR_REGISTRY || 'krccr.ccs.tencentyun.com' }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      TCR_IMAGE: ${{ vars.TCR_IMAGE || 'yimtune/iftop' }}
    steps:
      - name: Validate registry configuration
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for key in TCR_REGISTRY TCR_IMAGE TCR_USERNAME TCR_PASSWORD DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions variable or secret: $key"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iftop-linux-*
          path: dist
          merge-multiple: true
      - name: Prepare image context
        run: |
          mv dist/iftop-linux-x86_64 dist/iftop-linux-amd64
          mkdir -p dist/terminfo
          for term in xterm xterm-256color linux vt100 screen screen-256color; do
            infocmp -x "$term" | tic -x -o dist/terminfo /dev/stdin
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          {
            echo 'tags<<EOF'
            for image in "${TCR_REGISTRY}/${TCR_IMAGE}" "docker.io/yimtune/iftop"; do
              echo "${image}:sha-${GITHUB_SHA}"
              if [ "$GITHUB_REF_TYPE" = tag ]; then
                echo "${image}:${GITHUB_REF_NAME}"
              fi
              if [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                echo "${image}:latest"
              fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          context: ./dist
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
