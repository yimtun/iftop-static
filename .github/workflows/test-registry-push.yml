name: Test registry push
on: workflow_dispatch

permissions: {}

jobs:
  push:
    name: Push test image to ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: TCR
            registry: ${{ vars.TCR_REGISTRY || 'krccr.ccs.tencentyun.com' }}
            image: ${{ vars.TCR_IMAGE || 'yimtune/iftop' }}
            username_secret: TCR_USERNAME
            password_secret: TCR_PASSWORD
          - target: Docker Hub
            registry: docker.io
            image: yimtune/iftop
            username_secret: DOCKERHUB_USERNAME
            password_secret: DOCKERHUB_TOKEN
    steps:
      - name: Log in
        uses: docker/login-action@v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets[matrix.username_secret] }}
          password: ${{ secrets[matrix.password_secret] }}
      - uses: docker/setup-buildx-action@v4
      - name: Push test manifest
        env:
          IMAGE: ${{ matrix.registry }}/${{ matrix.image }}:test
        run: |
          mkdir context
          echo "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > context/test-run
          printf 'FROM scratch\nCOPY test-run /test-run\n' > context/Dockerfile
          docker buildx build --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false --tag "$IMAGE" --push context
